<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Şarkı Mood</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Şarkı Mood">
<style>
:root{--bg:#f1f6fd;--card:#fff;--tx:#0f1e33;--mu:#5f7390;--ac:#1f6feb;--ac2:#e3eeff;--bd:#d3e2f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1624;--card:#14233a;--tx:#e8f0fc;--mu:#8aa2c2;--ac:#4c9aff;--ac2:#1b3354;--bd:#223a5c}}
:root[data-theme="dark"]{--bg:#0c1624;--card:#14233a;--tx:#e8f0fc;--mu:#8aa2c2;--ac:#4c9aff;--ac2:#1b3354;--bd:#223a5c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{padding:14px 18px 6px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;margin:0}
.sc{font-size:13px;background:var(--ac2);color:var(--ac);padding:5px 10px;border-radius:99px;font-weight:600}
main{padding:8px 16px 96px;max-width:560px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 0 8px;font-size:11px;font-weight:600}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0}
.top{display:flex;gap:12px;align-items:center}
.em{font-size:34px;width:52px;height:52px;display:grid;place-items:center;background:var(--ac2);border-radius:14px;flex:none}
.t{font-weight:700}.a{color:var(--mu);font-size:14px}
.by{font-size:12px;color:var(--mu);margin-top:2px}
.note{margin-top:10px;padding:10px 12px;background:var(--ac2);border-radius:12px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.chip.h{border-color:var(--ac);color:var(--ac)}
label{display:block;font-size:13px;color:var(--mu);margin:14px 0 6px;font-weight:600}
input,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 13px;font-size:14px}
.opt.on{background:var(--ac);border-color:var(--ac);color:#fff}
.btn{width:100%;border:0;background:var(--ac);color:#fff;font-weight:700;padding:14px;border-radius:14px;font-size:16px;margin-top:18px}
.btn.s{width:auto;padding:9px 14px;font-size:14px;margin:0}
.btn.g{background:var(--ac2);color:var(--ac)}
.row{display:flex;gap:8px;margin-top:10px}
.msg{text-align:center;color:var(--mu);padding:40px 20px}
.lnk{font-size:13px;color:var(--ac);text-decoration:none;margin-top:10px;display:inline-block}
.bar{height:8px;border-radius:99px;background:var(--ac);margin-top:4px}
.sm{font-size:13px;color:var(--mu)}
.ok{color:#2b9a5b;font-weight:700}.dots{margin-left:auto;font-size:24px;color:var(--mu);padding:0 4px}.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}.shs{width:100%;max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}.sb{display:block;width:100%;text-align:left;border:0;background:var(--ac2);color:var(--tx);padding:14px;border-radius:12px;font-size:16px;margin-top:8px}.card[data-id]{cursor:pointer}
.cats{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.cats>*{flex:none;white-space:nowrap}
button.chip{background:var(--card);font:inherit;font-size:12px}button.chip.h{background:var(--ac2)}
select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.day{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:4px 0;font-size:13px;min-height:50px}
.day span{display:block;font-size:14px;min-height:18px}.day i{font-size:10px;color:var(--mu);font-style:normal;margin-left:1px}
.day.on{background:var(--ac);border-color:var(--ac);color:#fff}.day.on i{color:#fff}.lock{opacity:.45}
.stars{margin-top:8px}.stb{border:0;background:none;font-size:26px;color:var(--bd);padding:0 4px}.stb.on{color:#e0a800}
nav button{font-size:10px}textarea[readonly]{font-size:13px}
</style>
</head>
<body>
<header><h1>🎧 Şarkı Mood</h1><div class="sc" id="sc"></div></header>
<main id="app"><div class="msg">Yükleniyor…</div></main>
<nav>
<button data-t="feed" class="on"><span>🎶</span>Akış</button>
<button data-t="cal"><span>📅</span>Takvim</button>
<button data-t="game"><span>🎯</span>Oyun</button>
<button data-t="time"><span>⏳</span>Zaman</button>
<button data-t="add"><span>➕</span>Ekle</button>
<button data-t="top"><span>🏆</span>Top</button>
<button data-t="play"><span>🧮</span>Süre</button>
<button data-t="stats"><span>📊</span>Mood</button>
</nav>
<script>
(function(){
var K="sm_cfg",c=null,uid=null;
try{if(/[?&]reset/.test(location.search))localStorage.removeItem(K);c=JSON.parse(localStorage.getItem(K)||"null")}catch(e){}
var NM={ecrin:"Ecrin",huzur:"Huzur"};if(c&&!NM[c.who])c.who=null;uid=(c&&c.who)?c.who:"kisi0";
function base(){return c.url.replace(/\/+$/,"")+"/r-"+c.code}
function jf(p,m,b){return fetch(base()+"/"+p+".json",{method:m,body:b!==undefined?JSON.stringify(b):undefined}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})}
var cols={};
function load(col){return jf(col,"GET").then(function(v){var a=[];if(v&&typeof v==="object")Object.keys(v).forEach(function(k){var d=v[k];if(d&&typeof d==="object")a.push({id:k,data:function(){return d}})});return a})}
function emit(col){var o=cols[col];if(!o)return;load(col).then(function(arr){o.subs.forEach(function(s){var a=arr.slice();if(s.ord)a.sort(function(x,y){var p=x.data()[s.ord[0]]||0,q=y.data()[s.ord[0]]||0;return s.ord[1]==="desc"?q-p:p-q});s.cb({docs:a})})}).catch(function(){o.subs.forEach(function(s){if(s.err)s.err()})})}
function watch(col,sub){var o=cols[col];if(!o){o=cols[col]={subs:[]};try{var es=new EventSource(base()+"/"+col+".json");es.addEventListener("put",function(){emit(col)});es.addEventListener("patch",function(){emit(col)})}catch(e){}setInterval(function(){emit(col)},6000)}o.subs.push(sub);emit(col);return function(){o.subs=o.subs.filter(function(x){return x!==sub})}}
var db={collection:function(col){return{add:function(d){return jf(col,"POST",d).then(function(r){emit(col);return{id:r.name}})},orderBy:function(f,dir){return{onSnapshot:function(cb,err){return watch(col,{cb:cb,err:err,ord:[f,dir]})}}},onSnapshot:function(cb,err){return watch(col,{cb:cb,err:err})}}},
doc:function(p){var col=p.split("/")[0];function aft(r){emit(col);return r}return{set:function(d){return jf(p,"PUT",d).then(aft)},update:function(d){return jf(p,"PATCH",d).then(aft)},delete:function(){return jf(p,"DELETE").then(aft)}}}};
var user={id:function(){return Promise.resolve(uid)},me:function(){return Promise.resolve({id:uid,name:NM[uid]||""})},profiles:function(ids){var o={};ids.forEach(function(i){o[i]={name:NM[i]||""}});return Promise.resolve(o)}};
window.claude={use:function(n){return Promise.resolve(n==="user"?user:(n==="db"&&c&&c.url&&c.who&&c.code?db:null))}};
window.smSave=function(){var v=(document.getElementById("smu").value||"").trim();if(!/^https:\/\/.+/.test(v)){alert("Adres https:// ile başlamalı");return}var cd=(document.getElementById("smc").value||"").toLowerCase().replace(/[^a-z0-9]/g,"");if(cd.length<5){alert("Özel kod en az 5 harf veya rakam olmalı");return}var wr=document.querySelector('input[name="smw"]:checked');if(!wr){alert("Ecrin mi Huzur mu olduğunu seç");return}
fetch(v.replace(/\/+$/,"")+"/r-"+cd+".json").then(function(r){if(!r.ok)throw 0;try{localStorage.setItem(K,JSON.stringify({url:v,who:wr.value,code:cd}))}catch(e){alert("Tarayıcı ayarı kaydedemedi. Dosyayı Chrome'da aç.");return}location.reload()}).catch(function(){alert("Bağlanamadı. Adresi ve veritabanı kurallarını kontrol et.")})};
window.smSetup=function(){return'<div class="card"><div class="t">🔗 Bağlantı kur</div><div class="sm" style="margin-top:6px">Sevgilinle ortak kullanmak için Firebase veritabanı adresini yapıştır. İkiniz de aynı adresi girin.</div><label>Sen kimsin?</label><div class="opts"><label class="opt" style="margin:0"><input type="radio" name="smw" value="ecrin" style="width:auto;margin-right:6px">Ecrin</label><label class="opt" style="margin:0"><input type="radio" name="smw" value="huzur" style="width:auto;margin-right:6px">Huzur</label></div><div class="sm" style="margin-top:6px">Kendi adını seç. İkiniz aynı adı seçmeyin.</div><label>Özel kod</label><input id="smc" placeholder="ikinizin bildiği gizli kod (en az 5 harf/rakam)" value="'+((c&&c.code)||"")+'" autocapitalize="off" autocorrect="off"><div class="sm" style="margin-top:6px">Sadece ikiniz bilin. Aynı kodu girmeyen kimse verilerinize erişemez.</div><label>Veritabanı adresi</label><input id="smu" placeholder="https://xxxx-default-rtdb.firebaseio.com" value="'+((c&&c.url)||"")+'" autocapitalize="off" autocorrect="off"><button class="btn" onclick="smSave()">Kaydet ve başla</button></div>'};
})();
</script>
<script>
var MOODS=[["😊","Neşeli"],["😢","Hüzünlü"],["🔥","Enerjik"],["🌙","Sakin"],["💘","Aşık"],["😤","Öfkeli"],["🥹","Nostaljik"],["🌧️","Melankolik"],["🚗","Yolculuk"],["💪","Motive"]];
var TEMPO=["Yavaş","Orta","Hızlı"],LANG=["Türkçe","Yabancı"],GENRE=["Pop","Rock","Rap","Arabesk","Sanat/Halk","Elektronik","Caz","Diğer"],ERA=["80ler","90lar","2000ler","2010lar","2020ler"];
var st={rates:[],pq:[],qi:0,plf:"all",tq:"",cp:"",app:(function(){try{return localStorage.getItem("app")||"yt"}catch(e){return"yt"}})(),del:null,derr:"",topv:"m",listens:[],clue:"",cat:["mood",null],q:"",cal:null,tops:[],tab:"feed",songs:[],me:null,names:{},form:{mood:0,tempo:"Orta",lang:"Türkçe",genre:"Pop",era:"2020ler",game:false},err:"",guessMsg:{},sheet:null,edit:null,test:{},pre:null,mode:"feed",slots:[],slotEdit:null,sf:null};
var db=null,user=null,app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function norm(s){return String(s).toLowerCase().replace(/ı/g,"i").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9]/g,"")}
function nm(id){return id===st.me?"Sen":(st.names[id]||"Sevgilin")}
function ago(ts){var m=Math.floor((Date.now()-ts)/60000);if(m<1)return"az önce";if(m<60)return m+" dk önce";var h=Math.floor(m/60);if(h<24)return h+" sa önce";return Math.floor(h/24)+" gün önce"}
function lnk(s){var q=encodeURIComponent(s.title+" "+s.artist);return st.app==="sp"?(/^https:\/\/open\.spotify\.com\/(intl-[a-z]+\/)?track\//.test(s.sp||"")?s.sp.split("?")[0]:"https://open.spotify.com/search/"+q):"https://music.youtube.com/search?q="+q}
function chips(s,n){var a=[s.tempo,s.lang];if(n>=1)a.push(s.genre);if(n>=2)a.push(s.era);return a}

function rt(id,by){var x=st.rates.filter(function(r){return r.sid===id&&r.by===by})[0];return x?x.r:0}
function stars(id){var m=rt(id,st.me),o=st.rates.filter(function(r){return r.sid===id&&r.by!==st.me})[0],h='<div class="stars">';for(var i=1;i<=5;i++)h+='<button class="stb'+(i<=m?' on':'')+'" data-act="rate" data-id="'+id+'" data-v="'+i+'">★</button>';return h+(o?'<span class="sm"> '+esc(nm(o.by))+': '+o.r+'★</span>':'')+'</div>'}
function avg(id){var a=st.rates.filter(function(r){return r.sid===id});return a.length?a.reduce(function(t,r){return t+r.r},0)/a.length:0}
function plSongs(){var f=st.plf;return st.songs.filter(function(s){if(s.game&&!s.game.solved&&!s.game.gaveUp)return false;return f==="me"?s.by===st.me:f==="ot"?s.by!==st.me:f==="top"?avg(s.id)>=4:true})}
function eqTab(){var t=0;st.listens.forEach(function(x){if(find(x.sid))t+=x.n});
  if(!t)return'<div class="card"><div class="t">⏳ Dinleme eşdeğerleri</div><div class="sm" style="margin-top:6px">"Dinle" bağlantılarına dokundukça dolacak.</div></div>';
  var m=t*3.5,E=[["📖","sayfa kitap okumaya",2],["☕","fincan çay demlemeye",5],["🍳","kez yumurta haşlamaya",10],["🚿","kez duş almaya",8],["🍕","pizza pişirmeye",15],["🚶","km yürümeye",12],["🏃","kez 5 km koşuya",30],["📺","dizi bölümü izlemeye",45],["🎬","kez Titanik izlemeye",195],["🧙","kez Harry Potter 1 izlemeye",152],["✈️","kez İstanbul–İzmir uçuşuna",60],["🚗","kez İstanbul–Ankara yolculuğuna",300],["🛌","gece uykusuna",480]],
  h='<div class="card"><div class="t">⏳ Dinleme eşdeğerleri</div><div class="sm" style="margin-top:6px">'+t+' dinleme · ≈ '+Math.round(m)+' dk ('+(m/60).toFixed(1)+' saat)</div>';
  E.forEach(function(x){var v=m/x[2];h+='<div class="sm" style="margin-top:6px">'+x[0]+' ≈ '+(v>=10?Math.round(v):v.toFixed(1))+' '+x[1]+'</div>'});return h+'</div>'}
function playTab(){
  var f=st.plf,h='<div class="cats">'+[["all","Hepsi"],["me","Benim"],["ot","Sevgilimin"],["top","⭐ 4+"]].map(function(c){return'<button class="opt'+(c[0]===f?' on':'')+'" data-act="plf" data-v="'+c[0]+'">'+c[1]+'</button>'}).join("")+'</div>',L=plSongs(),by={};
  L.forEach(function(s){by[s.id]=s});var q=st.pq.filter(function(id){return by[id]});
  h+='<div class="row"><button class="btn s" data-act="qshuf">🔀 Karıştır</button><button class="btn s g" data-act="qseq">↕ Sırayla</button><button class="btn s g" data-act="qcopy">📋 Kopyala</button></div><div class="sm" style="margin-top:6px">'+L.length+' şarkı</div>';
  if(st.cp)h+='<div class="card"><div class="sm" style="margin-bottom:8px">Liste kopyalandı (olmadıysa metne basılı tutup kopyala). Liste aktarma servisleriyle Spotify çalma listesine çevrilebilir.</div><textarea rows="6" readonly>'+esc(st.cp)+'</textarea></div>';
  if(q.length){var i=Math.min(st.qi,q.length-1),s=by[q[i]];
    h+='<div class="card"><div class="sm">Sırada · '+(i+1)+'/'+q.length+'</div><div class="t" style="margin-top:4px">'+esc(s.title)+'</div><div class="a">'+esc(s.artist)+'</div><a class="lnk" data-act="play" data-id="'+s.id+'" target="_blank" rel="noopener" href="'+lnk(s)+'">▶ Dinle ('+(st.app==="sp"?"Spotify":"YT Music")+')</a><div class="row"><button class="btn s g" data-act="qprev">⏮ Önceki</button><button class="btn s" data-act="qnext">⏭ Sıradaki</button></div></div>';
    q.slice(i+1,i+9).forEach(function(id,k){var u=by[id];h+='<button class="sb" data-act="qgo" data-v="'+(i+1+k)+'">'+(i+2+k)+'. '+esc(u.title)+' · '+esc(u.artist)+'</button>'})}
  else h+='<div class="msg">Listeyi başlatmak için 🔀 Karıştır ya da ↕ Sırayla\'ya dokun.</div>';
  return h+eqTab()}
function score(){var t={};st.songs.forEach(function(s){var g=s.game;if(g&&g.solved&&g.by){t[g.by]=(t[g.by]||0)+g.points}});return t}

function card(s){
  var g=s.game,mine=s.by===st.me,m=MOODS[s.mood]||MOODS[0];
  var hide=g&&!g.solved&&!g.gaveUp&&(!mine||st.test[s.id]);
  var h='<div class="card"'+(mine?' data-id="'+s.id+'"':'')+'><div class="top"><div class="em">'+m[0]+'</div><div style="min-width:0">';
  if(hide){
    h+='<div class="t">🎯 Gizli şarkı</div><div class="a">Mood: '+m[1]+'</div>';
  }else{
    h+='<div class="t">'+esc(s.title)+'</div><div class="a">'+esc(s.artist)+' · '+m[1]+'</div>';
  }
  h+='<div class="by">'+esc(nm(s.by))+' · '+ago(s.ts)+(g&&mine&&!g.solved&&!g.gaveUp&&!st.test[s.id]?' · tahmin bekliyor 🎯':'')+'</div></div>'+(mine?'<div class="dots">⋯</div>':'')+'</div>';
  if(hide){
    var n=g.hints||0,hs=hintChips(s,n);
    h+='<div class="chips">'+hs.map(function(c){return'<span class="chip h">'+esc(c)+'</span>'}).join("");
    
    h+='</div>';
    h+='<div class="row"><input id="g'+s.id+'" placeholder="Şarkı adını tahmin et" autocomplete="off"><button class="btn s" data-act="guess" data-id="'+s.id+'">Tahmin</button></div>';
    h+='<div class="sm" style="margin-top:8px">'+(st.guessMsg[s.id]||"")+'</div>';
    h+='<div class="row">'+(n<4?'<button class="btn s g" data-act="hint" data-id="'+s.id+'">💡 İpucu aç (−1 puan)</button>':'')+'<button class="btn s g" data-act="giveup" data-id="'+s.id+'">Pes</button></div>';
    h+='<div class="sm" style="margin-top:6px">Şu an değeri: '+Math.max(1,5-n)+' puan</div>';
  }else{
    h+='<div class="chips">'+[s.lang,s.era].filter(Boolean).map(function(c){return'<span class="chip">'+esc(c)+'</span>'}).join("")+'</div>';
    if(s.note)h+='<div class="note">'+esc(s.note)+'</div>';
    if(g&&g.solved)h+='<div class="sm" style="margin-top:8px"><span class="ok">✓ '+esc(nm(g.by))+' bildi</span> · +'+g.points+' puan</div>';
    if(g&&g.gaveUp)h+='<div class="sm" style="margin-top:8px">Pes edildi 🏳️</div>';
    h+=stars(s.id);h+='<a class="lnk" data-act="play" data-id="'+s.id+'" target="_blank" rel="noopener" href="'+lnk(s)+'">▶ Dinle ('+(st.app==="sp"?"Spotify":"YT Music")+')</a>';
    if(mine)h+=' <a class="lnk" href="#" data-act="del" data-id="'+s.id+'" style="margin-left:14px;color:var(--mu)">Sil</a>';
  }
  return h+'</div>';
}

var TR_M=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
function pad(n){return n<10?"0"+n:""+n}
function slotsList(){
  var d=new Date(),y=d.getFullYear(),m=d.getMonth(),wd=(d.getDay()+6)%7,ws=new Date(y,m,d.getDate()-wd);
  var l=[{k:"gun-"+y+"-"+pad(m+1)+"-"+pad(d.getDate()),l:"Bugün · "+d.getDate()+" "+TR_M[m],q:"Bugünün şarkısı hangisi olurdu?"},
   {k:"hafta-"+ws.getFullYear()+"-"+pad(ws.getMonth()+1)+"-"+pad(ws.getDate()),l:"Bu hafta",q:"Bu hafta bir şarkı olsa ne olurdu?"},
   {k:"ay-"+y+"-"+pad(m+1),l:"Bu ay · "+TR_M[m]+" "+y,q:"Bu ayı hangi şarkı anlatır?"}];
  for(var i=y;i>=2009;i--)l.push({k:"yil-"+i,l:""+i,q:i+" yılının şarkısı?"});
  return l}
function slotCard(sl){
